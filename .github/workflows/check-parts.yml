name: check-parts
on:
  push:
    paths: ["agent.py", "part_*.py", "parts/**", "scripts/**", "own/**", ".github/workflows/**"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pre-flight (compile and load without network)
        run: python scripts/preflight.py
