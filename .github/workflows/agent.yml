name: agent-cycle
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: agent
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate - scheduled runs respect /autorun off and the STOP file
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -f STOP ] || ! python3 -c "import json,sys; sys.exit(0 if json.load(open('state/state.json')).get('autorun', True) else 1)"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "scheduled run skipped: autorun is off or the STOP file is present"
            fi
          fi
      - name: Pre-flight (a broken upload must not silently stop the agent)
        id: pre
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/preflight.py
      - name: Tell owner if pre-flight failed
        if: steps.pre.outcome == 'failure' && steps.gate.outputs.skip != 'true'
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode text="⚠️ Предзапуск нашёл ошибку в загруженных файлах. Агент всё равно стартует: сломанный файл будет пропущен. Открой Actions → agent-cycle → шаг Pre-flight." >/dev/null || true
      - name: Run one cycle
        id: cycle
        if: steps.gate.outputs.skip != 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GEMINI_AGENT_API_KEY: ${{ secrets.GEMINI_AGENT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          MEMORY_TOKEN: ${{ secrets.MEMORY_TOKEN }}
          MASTODON_BASE: ${{ secrets.MASTODON_BASE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_VISIBILITY: ${{ secrets.MASTODON_VISIBILITY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
        run: python agent.py
      - name: Commit state and log
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached tools tools_pending modules_pending modules_approved reports experiments 2>/dev/null || true
          git add state logs docs/transparency.md own
          git diff --cached --quiet && exit 0
          git commit -m "Agent cycle"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done; exit 1
      - name: Queue the next cycle - owner can stop the chain with /autorun off or the STOP file
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ steps.cycle.outcome }}
          PRE: ${{ steps.pre.outcome }}
        run: |
          [ -f STOP ] && { echo "STOP file present: next cycle not queued"; exit 0; }
          python3 -c "import json,sys; d=json.load(open('state/state.json')); sys.exit(0 if d.get('autorun', True) else 1)" || { echo "autorun is off: next cycle not queued"; exit 0; }
          if [ "$CYCLE" = "cancelled" ]; then sleep 20; elif [ "$CYCLE" != "success" ] || [ "$PRE" = "failure" ]; then sleep 1800; else sleep 300; fi   # cancelled by the owner: queue at once; after a failure wait longer so a crash cannot loop fast
          gh workflow run agent.yml --ref main || true
